[project]
name = "support-model-compression"
version = "0.1.0"
description = "INT4 W4A16 compression pipeline for the customer-support serving model"
requires-python = ">=3.10,<3.13"

dependencies = [
    "llmcompressor>=0.8.0,<0.9",
    "transformers>=4.52",
    "torch>=2.6",
    "datasets>=3.0",
    "accelerate>=1.0",
    "huggingface-hub>=0.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = [
    "lm-eval>=0.4.5",
    "vllm==0.27.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
