[project]
name = "support-model-compression"
version = "0.1.0"
description = "INT4 W4A16 compression pipeline for the customer-support serving model"
requires-python = ">=3.10,<3.13"

dependencies = [
    "llmcompressor>=0.8.0,<0.9",
    "transformers>=4.52",
    "torch>=2.6",
    "datasets>=3.0",
    "accelerate>=1.0",
    "huggingface-hub>=0.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The release gate. Two tools because it asks two questions that can diverge:
# lm-eval for "is it still smart", GuideLLM for "is it still fast".
eval = [
    "lm-eval>=0.4.5",
    "guidellm>=0.3.0",
    "vllm==0.27.1",
]
# Preference fine-tuning from collected feedback. Separate from `eval` because
# training needs a GPU host and the gate can be run from CI against a served
# endpoint.
train = [
    "trl>=0.12",
    "peft>=0.13",
    "vllm==0.27.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
