# Embeddings run on CPU, deliberately kept off the serving GPU.
#
# Ingesting a large PDF is a burst of hundreds of embedding calls. Running those
# on the GPU would evict KV cache blocks and spike latency for every customer
# mid-conversation. A small encoder on CPU is fast enough and isolates the two
# workloads completely.

replicaCount: 2

image:
  repository: ghcr.io/huggingface/text-embeddings-inference
  tag: cpu-1.5
  pullPolicy: IfNotPresent

model:
  id: BAAI/bge-small-en-v1.5

service:
  type: ClusterIP
  port: 8001

resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    # No CPU limit: throttling an inference process makes p99 latency wildly
    # unpredictable, and this pool is cheap to scale horizontally instead.
    memory: 4Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Model download on first start; the cache volume makes restarts fast.
modelCache:
  enabled: true
  size: 5Gi

nodeSelector:
  workload: general
tolerations: []
podAnnotations: {}
