{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  # Node upgrades and autoscaler drains must not be able to take the serving
  # tier to zero — replacing a replica takes minutes.
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "vllm.selectorLabels" . | nindent 6 }}
{{- end }}
---
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vllm.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Only the backend gateway may reach the model. Everything else in the
    # cluster is denied by default — the gateway is where prompt compilation,
    # guardrails and audit logging live, so bypassing it would bypass all three.
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.allowFromLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8000
    # Prometheus scrapes /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
{{- end }}
---
{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      {{- include "vllm.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      # 15s rather than the usual 30s: queue depth drives autoscaling, and a
      # coarser interval means the HPA reacts a scrape late.
      interval: {{ .Values.serviceMonitor.interval }}
{{- end }}
