name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://support:support@localhost:5432/support_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        working-directory: backend
        run: uv sync --all-extras
      - name: Lint
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        working-directory: backend
        run: uv run mypy app
      - name: Test
        working-directory: backend
        run: uv run pytest -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Unit tests
        working-directory: frontend
        run: npm run test -- --run
      - name: Build
        working-directory: frontend
        run: npm run build

  observability:
    name: Observability (PromQL syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install promtool
        run: |
          VERSION=2.55.1
          curl -sSL -o /tmp/prom.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${VERSION}/prometheus-${VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tar.gz -C /tmp
          sudo mv "/tmp/prometheus-${VERSION}.linux-amd64/promtool" /usr/local/bin/

      # A dashboard panel with a bad query renders as "No data", which looks
      # identical to a quiet system. Review time is the only reliable moment to
      # catch it.
      - name: Check alert rules and dashboard queries
        run: |
          pip install pyyaml
          python observability/check.py

  terraform:
    name: Terraform (fmt, validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Format check
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate each environment
        run: |
          set -euo pipefail
          for env in infra/terraform/envs/*/; do
            echo "::group::validate $env"
            terraform -chdir="$env" init -backend=false
            terraform -chdir="$env" validate
            echo "::endgroup::"
          done

  helm:
    name: Helm (lint, template, schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/

      # Rendering alone only proves the templates produce YAML. Schema
      # validation is what catches things the API server would reject at apply
      # time — duplicate label keys, bad field names, wrong types — instead of
      # discovering them mid-deploy.
      - name: Lint, render and schema-check every chart
        run: |
          set -euo pipefail
          for chart in deploy/helm/*/; do
            name=$(basename "$chart")
            echo "::group::$name"
            helm lint "$chart"
            helm template "$name" "$chart" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -kubernetes-version 1.31.0
            echo "::endgroup::"
          done
