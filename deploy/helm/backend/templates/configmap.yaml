apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
data:
  VLLM_BASE_URL: {{ .Values.config.vllmBaseUrl | quote }}
  EMBEDDINGS_BASE_URL: {{ .Values.config.embeddingsBaseUrl | quote }}
  SERVED_MODEL_NAME: {{ .Values.config.servedModelName | quote }}
  EMBEDDINGS_MODEL: {{ .Values.config.embeddingsModel | quote }}
  EMBEDDINGS_DIM: {{ .Values.config.embeddingsDim | quote }}
  MAX_MODEL_LEN: {{ .Values.config.maxModelLen | quote }}
  MAX_OUTPUT_TOKENS: {{ .Values.config.maxOutputTokens | quote }}
  RETRIEVAL_TOP_K: {{ .Values.config.retrievalTopK | quote }}
  RETRIEVAL_MIN_SCORE: {{ .Values.config.retrievalMinScore | quote }}
  HISTORY_TURNS: {{ .Values.config.historyTurns | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  CORS_ALLOW_ORIGINS: {{ .Values.config.corsAllowOrigins | quote }}
  PROMETHEUS_URL: {{ .Values.config.prometheusUrl | quote }}
